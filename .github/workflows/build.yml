name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Build the macOS installers too
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch the engines
        run: node scripts/fetch-binaries.mjs win x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the configurations the app writes with the real engines
        shell: pwsh
        run: |
          node dist/smoke.js smoke
          $bin = 'resources\bin\win-x64'
          & $bin\xray.exe run -test -c smoke\xray-vless.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $bin\xray.exe run -test -c smoke\xray-wireguard.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $bin\sing-box.exe check -c smoke\tun.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $v = & $bin\openvpn\openvpn.exe --version 2>&1 | Out-String
          Write-Output $v
          if ($v -notmatch 'OpenVPN 2\.6') { exit 1 }
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: DT-Client-Windows
          path: release/DT-Client-Setup-*.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Packaging tools for rpm and pacman
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npm run build
      - name: Fetch the engines
        run: |
          node scripts/fetch-binaries.mjs linux x64
          node scripts/fetch-binaries.mjs linux arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the configurations the app writes with the real engines
        run: |
          node dist/smoke.js smoke
          bin=resources/bin/linux-x64
          $bin/xray run -test -c smoke/xray-vless.json
          $bin/xray run -test -c smoke/xray-wireguard.json
          $bin/sing-box check -c smoke/tun.json
      - name: Build deb, rpm and pacman packages (x64 and arm64)
        run: npx electron-builder --linux --x64 --arm64 --publish never
      - name: Install the deb, check the helper service answers, remove it
        run: |
          ls -la release
          sudo apt-get install -y "$(ls ./release/*.deb | grep -v arm64)"
          systemctl is-active dt-client-helper
          node scripts/helper-hello.mjs /run/dt-client/helper.sock
          test -x "/opt/DT Client/resources/bin/xray"
          sudo apt-get remove -y dt-client
          if systemctl is-active --quiet dt-client-helper; then echo "helper still running"; exit 1; fi
          test ! -e /etc/systemd/system/dt-client-helper.service
      - uses: actions/upload-artifact@v4
        with:
          name: DT-Client-Linux
          path: |
            release/*.deb
            release/*.rpm
            release/*.pacman
          if-no-files-found: error

  # Each distribution's package manager resolves the package's dependencies (no systemd in a container).
  linux-distros:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            install: apt-get update && apt-get install -y "$(ls ./pkg/*.deb | grep -v arm64)"
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y "$(ls ./pkg/*.deb | grep -v arm64)"
          - image: fedora:latest
            install: dnf install -y "$(ls ./pkg/*.rpm | grep -v aarch64)"
          - image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm "$(ls ./pkg/*.pacman | grep -v -e aarch64 -e arm64)"
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DT-Client-Linux
          path: pkg
      - run: ls pkg
      - run: ${{ matrix.install }}
      - run: test -x "/opt/DT Client/dt-client" && test -f "/opt/DT Client/resources/helper/helper.js" && test -f /etc/systemd/system/dt-client-helper.service
      - run: ELECTRON_RUN_AS_NODE=1 "/opt/DT Client/dt-client" -e "console.log(process.versions.node)"

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch the engines
        run: |
          node scripts/fetch-binaries.mjs mac x64
          node scripts/fetch-binaries.mjs mac arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the configurations the app writes with the real engines
        run: |
          node dist/smoke.js smoke
          bin=resources/bin/mac-arm64
          $bin/xray run -test -c smoke/xray-vless.json
          $bin/sing-box check -c smoke/tun.json
      - name: Build the installer packages (Intel and Apple silicon)
        run: npx electron-builder --mac --x64 --arm64 --publish never
      - name: Install the Apple silicon package, check the helper answers
        run: |
          sudo installer -pkg release/DT-Client-*-mac-arm64.pkg -target /
          codesign --verify --deep --strict "/Applications/DT Client.app"
          sleep 3
          sudo launchctl print system/team.datacraft.dtclient.helper | head -20
          node scripts/helper-hello.mjs /var/run/dt-client.sock
          sudo "/Applications/DT Client.app/Contents/Resources/uninstall.sh"
          test ! -e "/Applications/DT Client.app"
      - uses: actions/upload-artifact@v4
        with:
          name: DT-Client-macOS
          path: release/*.pkg
          if-no-files-found: error

  release:
    needs: [windows, linux, linux-distros, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --title "DT Client $GITHUB_REF_NAME" --notes-file ../RELEASE_NOTES.md

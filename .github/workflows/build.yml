name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Build the macOS installers too
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch the engines
        run: node scripts/fetch-binaries.mjs win x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the configurations the app writes with the real engines
        shell: pwsh
        run: |
          node dist/smoke.js smoke
          $bin = 'resources\bin\win-x64'
          & $bin\xray.exe run -test -c smoke\xray-vless.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $bin\xray.exe run -test -c smoke\xray-wireguard.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $bin\sing-box.exe check -c smoke\tun.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $v = & $bin\openvpn\openvpn.exe --version 2>&1 | Out-String
          Write-Output $v
          if ($v -notmatch 'OpenVPN 2\.6') { exit 1 }
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: DT-Client-Windows
          path: release/DT-Client-Setup-*.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Packaging tools for rpm and pacman
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npm run build
      - name: Fetch the engines
        run: |
          node scripts/fetch-binaries.mjs linux x64
          node scripts/fetch-binaries.mjs linux arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the configurations the app writes with the real engines
        run: |
          node dist/smoke.js smoke
          bin=resources/bin/linux-x64
          $bin/xray run -test -c smoke/xray-vless.json
          $bin/xray run -test -c smoke/xray-wireguard.json
          $bin/sing-box check -c smoke/tun.json
      - name: Build deb, rpm and pacman packages (x64 and arm64)
        run: npx electron-builder --linux --x64 --arm64 --publish never
      - name: Install the deb, check the helper service answers, remove it
        run: |
          ls -la release
          sudo apt-get install -y "$(ls ./release/*.deb | grep -v arm64)"
          systemctl is-active dt-client-helper
          node scripts/helper-hello.mjs /run/dt-client/helper.sock
          test -x "/opt/DT Client/resources/bin/xray"
          sudo apt-get remove -y dt-client
          if systemctl is-active --quiet dt-client-helper; then echo "helper still running"; exit 1; fi
          test ! -e /etc/systemd/system/dt-client-helper.service
      - uses: actions/upload-artifact@v4
        with:
          name: DT-Client-Linux
          path: |
            release/*.deb
            release/*.rpm
            release/*.pacman
          if-no-files-found: error

  # Each distribution's package manager resolves the package's dependencies (no systemd in a container).
  linux-distros:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            install: apt-get update && apt-get install -y "$(ls ./pkg/*.deb | grep -v arm64)"
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y "$(ls ./pkg/*.deb | grep -v arm64)"
          - image: fedora:latest
            install: dnf install -y "$(ls ./pkg/*.rpm | grep -v aarch64)"
          - image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm "$(ls ./pkg/*.pacman | grep -v -e aarch64 -e arm64)"
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DT-Client-Linux
          path: pkg
      - run: ls pkg
      - run: ${{ matrix.install }}
      - run: test -x "/opt/DT Client/dt-client" && test -f "/opt/DT Client/resources/helper/helper.js" && test -f /etc/systemd/system/dt-client-helper.service
      - run: ELECTRON_RUN_AS_NODE=1 "/opt/DT Client/dt-client" -e "console.log(process.versions.node)"

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch the engines
        run: |
          node scripts/fetch-binaries.mjs mac x64
          node scripts/fetch-binaries.mjs mac arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the configurations the app writes with the real engines
        run: |
          node dist/smoke.js smoke
          bin=resources/bin/mac-arm64
          $bin/xray run -test -c smoke/xray-vless.json
          $bin/sing-box check -c smoke/tun.json
      # One architecture at a time: both builds would share the same intermediate component package.
      - name: Build the installer packages (Intel and Apple silicon)
        run: |
          npx electron-builder --mac --x64 --publish never
          npx electron-builder --mac --arm64 --publish never
      - name: Install the Apple silicon package, check the helper answers
        run: |
          sudo installer -pkg release/DT-Client-*-mac-arm64.pkg -target /
          codesign --verify --deep --strict "/Applications/DT Client.app"
          sleep 3
          sudo launchctl print system/team.datacraft.dtclient.helper | head -20
          node scripts/helper-hello.mjs /var/run/dt-client.sock
          sudo "/Applications/DT Client.app/Contents/Resources/uninstall.sh"
          test ! -e "/Applications/DT Client.app"
      - uses: actions/upload-artifact@v4
        with:
          name: DT-Client-macOS
          path: release/*.pkg
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Xray-core for Android (gomobile, all four processor families)
        working-directory: android/core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go get github.com/xtls/xray-core@latest
          go mod tidy
          go get golang.org/x/mobile/bind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" bind -target=android -androidapi 21 -javapkg team.datacraft.dtclient -trimpath -ldflags="-s -w -buildid=" -o ../app/libs/dtcore.aar .
          grep xray-core go.mod
      - name: hev-socks5-tunnel (MIT), the packet-to-SOCKS bridge
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/heiher/hev-socks5-tunnel | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "hev-socks5-tunnel $tag"
          git clone --depth 1 --branch "$tag" --recurse-submodules --shallow-submodules https://github.com/heiher/hev-socks5-tunnel /tmp/hev
          "$ANDROID_NDK_LATEST_HOME/ndk-build" -C /tmp/hev NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk \
            "APP_ABI=armeabi-v7a arm64-v8a x86 x86_64" APP_PLATFORM=android-21 \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/android/app/src/main/jniLibs" NDK_OUT=/tmp/hev-obj \
            "APP_CFLAGS=-O3 -DPKGNAME=team/datacraft/dtclient/vpn" "APP_LDFLAGS=-Wl,--build-id=none" -j4
          find android/app/src/main/jniLibs -type f ! -name '*.so' -delete
          find android/app/src/main/jniLibs -type f
      # OpenSSL takes most of the build; the result is kept until build.sh (and its pinned versions) change.
      - name: Restore OpenVPN for Android
        id: openvpn-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ovpn-jni
          key: openvpn-android-${{ hashFiles('android/openvpn/build.sh') }}
      - name: OpenVPN 2.7 for Android (GPLv2), with OpenSSL, LZ4 and LZO
        if: steps.openvpn-cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash android/openvpn/build.sh /tmp/ovpn-jni
      - name: Keep OpenVPN for Android
        if: steps.openvpn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/ovpn-jni
          key: openvpn-android-${{ hashFiles('android/openvpn/build.sh') }}
      - name: Add OpenVPN to the app
        run: |
          cp -r /tmp/ovpn-jni/. android/app/src/main/jniLibs/
          find android/app/src/main/jniLibs -name libovpnexec.so -exec ls -la {} +
      - name: Xray's geo files
        run: |
          node scripts/fetch-binaries.mjs linux x64
          cp resources/bin/linux-x64/geoip.dat resources/bin/linux-x64/geosite.dat android/app/src/main/assets/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APKs are signed with this runner's debug key and will not update each other."
          fi
      - name: Build the APKs
        env:
          DT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./package.json').version")
          gradle -p android assembleRelease -PappVersion="$version" --stacktrace
          mkdir -p release
          for apk in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed 's/^app-//; s/-release$//')
            cp "$apk" "release/DT-Client-$version-android-$abi.apk"
          done
          ls -la release
      # The emulator's data partition needs several GB the builds above have used up.
      - name: Make room for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /tmp/hev /tmp/hev-obj /tmp/ovpn-android
          go clean -cache -modcache || true
          df -h /
      # The emulator test connects through these (the emulator reaches this machine as 10.0.2.2).
      - name: OpenVPN servers for the emulator test
        run: bash android/openvpn/test-server.sh /tmp/ovpn-test
      - name: Allow the emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # On an Android 11 emulator: the tunnel library registers its natives, Xray runs the app's config,
      # and the app connects through OpenVPN over TCP and UDP.
      - name: Run the engines on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          disk-size: 2048M
          script: |
            gradle -p android connectedDebugAndroidTest -PappVersion=0.1.0 -Pandroid.testInstrumentationRunnerArguments.ovpnTcp=$(cat /tmp/ovpn-test/tcp.link) -Pandroid.testInstrumentationRunnerArguments.ovpnUdp=$(cat /tmp/ovpn-test/udp.link)
            adb install -r release/DT-Client-*-android-x86_64.apk
            adb shell am start -W -n team.datacraft.dtclient/.ui.MainActivity
            sleep 6
            adb exec-out screencap -p > android-welcome.png
            adb shell pidof team.datacraft.dtclient
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-results
          path: |
            android/app/build/outputs/androidTest-results
            android/app/build/reports/androidTests
          if-no-files-found: ignore
      - name: OpenVPN server logs
        if: always()
        run: |
          d=$(cat /tmp/ovpn-test/dir 2>/dev/null) || exit 0
          sudo tail -n 40 "$d"/server-*.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-screenshot
          path: android-welcome.png
      - uses: actions/upload-artifact@v4
        with:
          name: DT-Client-Android
          path: release/*.apk
          if-no-files-found: error

  release:
    needs: [windows, linux, linux-distros, macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # A release made on GitHub's Releases page creates the tag first; its files are added to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --title "DT Client $GITHUB_REF_NAME" --notes-file ../RELEASE_NOTES.md
          fi
